<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Customer Feedback Form</h2>
    <form action="/submit-feedback" method="POST">
        <label for="name">Name :</label>
        <input type="text" id="name" name="customerName">

        <label for="email">Email :</label>
        <input type="email" id="email" name="customerEmail">

        <label for="feedback">Your Feedback :</label>
        <textarea name="customerFeedback" id="feedback" rows="4"></textarea>

        <label for="rating">Rate Our Service :</label>
        <select name="customerRating" id="rating">
            <option value="5">Excellent</option>
            <option value="4">Good</option>
            <option value="3">Average</option>
            <option value="2">Poor</option>
            <option value="1">Very Poor</option>
        </select>

        <button type="submit">Submit Feedback</button>
    </form>
</body>

</html>
